name = "guada15"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# Namespace de KV donde se guardan los RSVPs.
# Crealo con: wrangler kv namespace create RSVP_KV
# y reemplazá el id de abajo por el que te devuelva ese comando.
[[kv_namespaces]]
binding = "RSVP_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
